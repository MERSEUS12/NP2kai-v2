name: Windows x64 embedded-child build

on:
  push:
    branches:
      - feature/alternative-b-child-window
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout embedded child-window branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Initialize required CMake module
        shell: pwsh
        run: git submodule update --init cmake/FindWDK

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and pkg-config
        shell: pwsh
        run: |
          choco install ninja pkgconfiglite --no-progress -y
          ninja --version
          pkg-config --version

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.28000 --exact --silent --accept-package-agreements --accept-source-agreements
          $wdkHeaders = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Filter ntddk.h -Recurse -ErrorAction SilentlyContinue
          if (-not $wdkHeaders) {
            throw 'WDK installation completed but ntddk.h was not found under Windows Kits.'
          }
          $wdkHeaders | Select-Object -First 1 -ExpandProperty FullName

      - name: Install vcpkg and libpng
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          & C:\vcpkg\vcpkg.exe install libpng:x64-windows-static

      - name: Configure NP2kai
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBUILD_I286=OFF -DUSE_SDL2=OFF

      - name: Build Windows x64 NP21kai
        shell: pwsh
        run: cmake --build build --target NP21kai_windows --parallel

      - name: Smoke-test NP2kai child HWND startup
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32WindowTest {
            [DllImport("user32.dll", EntryPoint="CreateWindowExW", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr CreateWindowEx(uint exStyle, string className, string title, uint style,
              int x, int y, int width, int height, IntPtr parent, IntPtr menu, IntPtr instance, IntPtr param);
            [DllImport("user32.dll", SetLastError=true)]
            public static extern bool DestroyWindow(IntPtr hwnd);
            [DllImport("user32.dll", EntryPoint="FindWindowExW", CharSet=CharSet.Unicode)]
            public static extern IntPtr FindWindowEx(IntPtr parent, IntPtr childAfter, string className, string windowName);
            [DllImport("user32.dll", EntryPoint="GetWindowLongPtrW")]
            public static extern IntPtr GetWindowLongPtr(IntPtr hwnd, int index);
            [DllImport("user32.dll")]
            public static extern bool PostMessage(IntPtr hwnd, uint message, IntPtr wParam, IntPtr lParam);
          }
          '@

          $parent = [Win32WindowTest]::CreateWindowEx(0, "STATIC", "NP2kai CI Parent", 0x00CF0000, 0, 0, 1024, 768, [IntPtr]::Zero, [IntPtr]::Zero, [IntPtr]::Zero, [IntPtr]::Zero)
          if ($parent -eq [IntPtr]::Zero) { throw "Could not create test parent HWND." }

          $process = $null
          $found = [IntPtr]::Zero
          try {
            $exe = Join-Path $env:GITHUB_WORKSPACE "build/NP21kai_windows.exe"
            $start = New-Object System.Diagnostics.ProcessStartInfo
            $start.FileName = $exe
            $start.Arguments = "/parenthwnd:$($parent.ToInt64())"
            $start.WorkingDirectory = (Split-Path $exe)
            $start.UseShellExecute = $false
            $process = [System.Diagnostics.Process]::Start($start)
            if (-not $process) { throw "NP2kai process could not be started." }

            for ($i = 0; $i -lt 40 -and $found -eq [IntPtr]::Zero; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { throw "NP2kai exited before creating its child window. ExitCode=$($process.ExitCode)" }
              $found = [Win32WindowTest]::FindWindowEx($parent, [IntPtr]::Zero, $null, $null)
            }

            if ($found -eq [IntPtr]::Zero) { throw "NP2kai did not create a direct child window inside the supplied parent HWND." }
            $style = [Win32WindowTest]::GetWindowLongPtr($found, -16).ToInt64()
            if (($style -band 0x40000000) -eq 0) { throw "NP2kai window exists but WS_CHILD is not set. Style=$style" }
            Write-Host "PASS: NP2kai created HWND $($found.ToInt64()) as WS_CHILD of $($parent.ToInt64())."
          }
          finally {
            if ($found -ne [IntPtr]::Zero) { [void][Win32WindowTest]::PostMessage($found, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) }
            if ($process -and -not $process.HasExited) {
              if (-not $process.WaitForExit(5000)) { $process.Kill(); $process.WaitForExit() }
            }
            [void][Win32WindowTest]::DestroyWindow($parent)
          }

      - name: Publish executable and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: NP2kai-Embedded-Child-Windows-x64-RelWithDebInfo
          path: |
            build/NP21kai_windows.exe
            build/*.pdb
          if-no-files-found: error
          retention-days: 14
