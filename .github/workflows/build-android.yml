name: Build NP2kai libretro core (Android arm64)

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (historial y tags completos, hacen falta para git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Corregir typo en jni/Android.mk
        run: |
          sed -i 's/INCFLAGS += (NP21_INCFLAGS)/INCFLAGS += $(NP21_INCFLAGS)/' jni/Android.mk
          grep -n 'NP21_INCFLAGS' jni/Android.mk

      - name: Mostrar versión del NDK
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"

      - name: Compilar con ndk-build (solo arm64-v8a)
        run: |
          "$ANDROID_NDK_LATEST_HOME/ndk-build" \
            NDK_PROJECT_PATH="$PWD" \
            APP_BUILD_SCRIPT="$PWD/jni/Android.mk" \
            NDK_APPLICATION_MK="$PWD/jni/Application.mk" \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-24 \
            APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true \
            -j"$(nproc)"

      - name: Preparar el core con el nombre que espera RetroArch
        run: |
          mkdir -p dist
          cp libs/arm64-v8a/libretro.so dist/np2kai_libretro_android.so
          ls -l dist
          file dist/np2kai_libretro_android.so

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: np2kai_libretro_android_arm64
          path: dist/np2kai_libretro_android.so
